name: Source archive and installed wheel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build source archive and wheel from that archive
        run: python -m build --outdir dist
      - name: Verify wheel bytes and metadata against source
        run: python scripts/verify_wheel.py dist
      - name: Verify extracted tests and installed command
        run: python scripts/verify_distribution.py dist
      - name: Retain verified wheel, source archive and checksums
        uses: actions/upload-artifact@v4
        with:
          name: json-repr-probe-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
